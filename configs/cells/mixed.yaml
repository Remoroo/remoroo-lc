# Mixed cell: one 6-DOF chain and one 7-DOF chain of different makes, different
# joint counts, different effector widths.  n = 13, task space = 12, action
# dimension = (6+1) + (6+2) = 15.  Nothing in the stack is told which is which.

lc_spec_version: "1.0"
name: mixed

limits: ../limits.yaml
gains: ../gains.default.yaml

models:
  - name: left
    urdf: ../../assets/urdf/chain6.urdf
    spheres: ../../assets/spheres/chain6_spheres.json
    base:
      xyz: [0.0, 0.35, 0.08]
      rpy: [0.0, 0.0, -0.35]
    rest: [0.0, 0.147, 1.704, 0.0, -0.281, 0.0]

  - name: right
    urdf: ../../assets/urdf/chain7.urdf
    spheres: ../../assets/spheres/chain7_spheres.json
    base:
      xyz: [0.0, -0.35, 0.08]
      rpy: [0.0, 0.0, 0.35]
    rest: [0.0, 0.3061, -0.2383, 1.1736, -2.1465, -0.7386, 0.0]

tcps:
  - name: left_tcp
    model: left
    frame: tool0
    effector: { kind: parallel_jaw, width: 1, default: [0.0] }
    damping: { w_thresh: 0.000165413 }

  # A two-channel effector: width is config, not a special case in code.
  - name: right_tcp
    model: right
    frame: tool0
    effector: { kind: two_channel_tool, width: 2, default: [0.0, 0.0] }
    damping: { w_thresh: 0.00112697 }

environment:
  - { name: table, type: plane, point: [0.0, 0.0, 0.0], normal: [0.0, 0.0, 1.0] }
  - name: back_wall
    type: box
    xyz: [-0.50, 0.0, 0.75]
    dims: [0.06, 2.00, 1.50]

collision:
  self_pairs: true
  cross_model: true
  environment: true
